
<!DOCTYPE html>
<html>
<head>
 <title>SAMXI SMART DOOR PRO</title>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
 <link rel="manifest" href="manifest.json">
 <meta name="theme-color" content="#2ecc71">
 
 <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
 <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
 
 <script>
 window.OneSignalDeferred = window.OneSignalDeferred || [];
 OneSignalDeferred.push(async function(OneSignal) {
 await OneSignal.init({
 appId: "a71c864f-2514-4798-b919-4511e0801b5a",
 allowLocalVarsInRemoteSettings: true,
 });

 OneSignal.Notifications.requestPermission();

 OneSignal.Notifications.addEventListener("foregroundWillDisplay", function(event) {
 event.preventDefault(); 
 const notification = event.notification;
 showToast("⚠️ " + notification.body, "error", 6000);
 vibrateAlert('opening');
 if (typeof playAlertBeeps === "function") { playAlertBeeps(); }
 });

 let savedID = localStorage.getItem("samxi_id");
 if (savedID) {
 OneSignal.login(savedID);
 OneSignal.User.addTag("device_id", savedID);
 }
 });
 </script>
 <style>
 .modal-content button {
 width: 100%; height: 55px; margin: 10px 0; padding: 0; font-size: 1.1rem;
 border-radius: 12px; display: flex; align-items: center; justify-content: center;
 border: none; cursor: pointer; font-weight: bold;
 }
 body{font-family:sans-serif;text-align:center;background:#141414;color:white;margin:0;}
 .header{background:#1a1a1a;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #2ecc71;}
 .led-group{display:flex; align-items:center; gap:12px;}
 .wifi-box{font-size:0.75rem; font-weight:bold; color:#888; display:flex; align-items:center; gap:4px; background:#222; padding:3px 12px; border-radius:15px; border:1px solid #333; transition: 0.3s;}
 .sig-excellent{color:#00ff7f; border-color: #00ff7f;}
 .sig-good{color:#f1c40f; border-color: #f1c40f;}
 .sig-weak{color:#ff4d4d; border-color: #ff4d4d;}
 .led{height:15px;width:15px;border-radius:50%;background:#444;transition:0.3s;}
 .green{background:#00ff7f;box-shadow:0 0 10px #00ff7f;}
 .red{background:#ff4d4d;box-shadow:0 0 10px #ff4d4d;}
 .gear-icon{width:22px; height:22px; cursor:pointer; fill:#f1c40f; visibility:hidden;}
 .container{padding:15px;max-width:400px;margin:auto;}
 #id {font-size: 2rem; font-weight: bold; text-align: center; color: #2ecc71; border: 2px solid #333;}
 input,select{width:100%;padding:15px;margin:10px 0;background:#2a2a2a;border:1px solid #333;color:white;border-radius:8px;box-sizing:border-box;}
 .status-box{background:#2a2a2a;margin:15px 0;padding:25px;border-radius:12px;font-size:1.6rem;color:#2ecc71;border:1px solid #333;font-weight:bold; transition: 0.3s; position: relative; overflow: hidden;}
 .progress-container{position:absolute; bottom:0; left:0; width:100%; height:6px; background:#1a1a1a; display:none;}
 .progress-bar{height:100%; width:0%; background:#2ecc71; transition: linear;}
 .net-status{font-size:0.9rem; margin-bottom:10px; padding:5px; border-radius:5px;}
 .online-bg{background:#1e3a1e; color:#00ff7f;}
 .offline-bg{background:#3a1e1e; color:#ff4d4d;}
 .alert-active{background:#ff4d4d !important; color:white !important; animation: blink 1s infinite;}
 @keyframes blink { 50% { opacity: 0.5; } }
 .btn{width:100%;margin:10px 0;padding:20px;font-size:1.5rem;border:none;border-radius:12px;font-weight:bold;cursor:pointer;color:white;transition:transform 0.1s; height: 70px; display: flex; align-items: center; justify-content: center;}
 .btn:active{transform:scale(0.96);}
 .up{background:#2ecc71;}
 .stop{background:#e74c3c;}
 .down{background:#3498db;}
 .auto{background:#f1c40f;color:black;display:none;}
 .timer-lock{pointer-events:none; opacity:0.35 !important; filter: contrast(0.8);}
 .hist-btn{background:#444; font-size:1.1rem; height:50px; margin-top:20px; border:1px solid #555;}
 .reconnect-btn {
 margin-left: 10px; padding: 8px 15px; background: #f1c40f; color: black;
 if(!isStatusLocked) { s.innerHTML = "GATE CLOSED" + document.getElementById('pCont').outerHTML; s.style.backgroundColor = "#1e3a1e"; hideProgress(); }
 }
 
 if (p === "OFFLINE" && !isCountingDown) {
 document.getElementById('led').className = "led red";
 if(!isStatusLocked) s.innerHTML = "OFFLINE" + document.getElementById('pCont').outerHTML;
 freezePanel(true, true); 
 return;
 }
 if (p === "PIN_OK") {
 localStorage.setItem("samxi_pin", document.getElementById('entryPin').value);
 document.getElementById('pg2').style.display='none'; document.getElementById('pg3').style.display='block';
 document.getElementById('gear').style.visibility='visible'; send("GET_STATE");
 } else if (p === "WRONG_PIN") { alert("Wrong PIN!"); }
 else if (p === "TELEGRAM_LINKED") {
 showToast("TELEGRAM SYNC SUCCESSFUL!", "green");
 document.getElementById('tgModal').style.display = 'none';
 document.getElementById('modal').style.display = 'block';
 }
 else if (p === "ONLINE" || p === "PAUSED" || p.startsWith("DATA|")) {
 document.getElementById('pg1').style.display='none';
 if(document.getElementById('pg3').style.display !== 'block') document.getElementById('pg2').style.display='block';
 if(p.startsWith("DATA|")) {
 let d = p.split("|");
 updateWiFi(d[1]);
 if (!timerEditing) { document.getElementById('at').value = d[3]; currentWait = d[3]; document.getElementById('ae').value = d[2]; document.getElementById('abtn').style.display = (d[2]=="1") ? "block" : "none"; }
 if(!isStatusLocked) {
 if(p.includes("OPEN")) { lastSensorStatus = "OPEN"; s.innerHTML = "GATE OPENED" + document.getElementById('pCont').outerHTML; s.style.backgroundColor = "#3a1e1e"; }
 else if(p.includes("CLOSED")) { lastSensorStatus = "CLOSED"; s.innerHTML = "GATE CLOSED" + document.getElementById('pCont').outerHTML; s.style.backgroundColor = "#1e3a1e"; }
 }
 } else if (p === "START_AUTO") { startAuto(); }
 else if (p === "PIN_CHANGED") { localStorage.setItem("samxi_pin", document.getElementById('newPin').value); document.getElementById('entryPin').value = document.getElementById('newPin').value; showToast("PIN UPDATED SUCCESSFULLY", "green"); timerEditing = false; }
 else if (p === "VOICE_LINKED") { showToast("The keys are saved successfully!", "green", 6000); document.getElementById('sKey').value = ""; document.getElementById('sSecret').value = ""; document.getElementById('sId').value = ""; }
 }
 };
 client.connect({ useSSL: true, keepAliveInterval: 10, timeout: 5, onSuccess: () => { client.subscribe("samxi/" + dev + "/state", { qos: 1 }); requestWakeLock(); send("GET_STATE"); const ns = document.getElementById('netStat'); ns.innerText = "System Ready"; ns.className = "net-status online-bg"; setTimeout(() => { ns.style.display = 'none'; }, 2000); }, onFailure: (e) => { setTimeout(connect, 5000); } });
 }

 function verifyPin() { if(audioCtx.state === 'suspended') audioCtx.resume(); requestWakeLock(); send("VERIFY|" + document.getElementById('entryPin').value); }

 function changePin() { let np = document.getElementById('newPin').value; if(np.length<4){alert("ENTER 4 DIGITS!"); return;} timerEditing = true; send("SETPIN|"+np); setTimeout(() => { timerEditing = false; }, 3000); alert("PIN UPDATED SUCCESSFULLY!"); }

 function save() { let timerVal = document.getElementById('at').value; let autoVal = document.getElementById('ae').value; currentWait = timerVal; document.getElementById('abtn').style.display = (autoVal=="1") ? "block" : "none"; timerEditing = true; send("CONFIG|" + timerVal + "|" + autoVal); setTimeout(() => { timerEditing = false; }, 3000); alert("YOUR SETTINGS SAVED!"); }

 function openTgModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('tgModal').style.display = 'block'; }

 function syncTelegram() {
 let id = document.getElementById('tgChatId').value.trim();
 if(id.length < 5) { showToast("Please enter a valid ID", "error"); return; }
 showToast("Syncing ID with Door...", "green");
 send("SETCHAT|" + id); 
 }

 function factoryReset() { if(confirm("Are you sure? This will wipe all settings and restart the device.")) send('RESET_FACTORY'); }
 
 function openVoiceModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('voiceModal').style.display = 'block'; }

 function saveVoice() {
 let k = document.getElementById('sKey').value.trim();
 let s = document.getElementById('sSecret').value.trim();
 let i = document.getElementById('sId').value.trim();
 if(!k || !s || !i) { showToast("Please fill all 3 Voice keys!", "error"); return; }
 showToast("Sending Keys to Door...", "green");
 send("SINRIC|" + k + "|" + s + "|" + i); 
 }

 function send(c) { if(client && client.isConnected()){ let m = new Paho.MQTT.Message(c); m.destinationName = "samxi/"+dev+"/cmd"; client.send(m); } }

 function updateWiFi(rssi) {
 const box = document.getElementById('wifiSig'); const val = document.getElementById('rssiVal'); box.style.display = 'flex'; const r = parseInt(rssi); let statusText = "";
 if (r >= -50) { statusText = "EXTREME"; box.className = "wifi-box sig-excellent"; } else if (r >= -60) { statusText = "BEST"; box.className = "wifi-box sig-excellent"; } else if (r >= -70) { statusText = "GOOD"; box.className = "wifi-box sig-good"; } else if (r >= -80) { statusText = "MODERATE"; box.className = "wifi-box sig-good"; } else { statusText = "WEAK"; box.className = "wifi-box sig-weak"; }
 val.innerText = statusText + " (" + r + "dBm)";
 }

 function showProgress(duration) { const cont = document.getElementById('pCont'); const bar = document.getElementById('pBar'); cont.style.display = 'block'; bar.style.transition = 'none'; bar.style.width = '0%'; setTimeout(() => { bar.style.transition = `width ${duration}s linear`; bar.style.width = '100%'; }, 50); }

 function hideProgress() { document.getElementById('pCont').style.display = 'none'; }

 function freezePanel(status, forceAll = false) { const btns = document.querySelectorAll('#pg3 .btn'); btns.forEach(btn => { if (forceAll) { status ? btn.classList.add('timer-lock') : btn.classList.remove('timer-lock'); return; } if (btn.id !== 'abtn') status ? btn.classList.add('timer-lock') : btn.classList.remove('timer-lock'); }); }

 function fetchSecurityLogs() {
 const display = document.getElementById("securityLogDisplay");
 let uLogs = JSON.parse(localStorage.getItem("samxi_unauthorized_logs") || "[]");
 let html = "";
 if (uLogs.length === 0) {
 html = "<p style='color:#2ecc71; text-align:center;'>No unauthorized events recorded.</p>";
 } else {
 uLogs.forEach(log => {
 html += `<div style="padding:10px; border-bottom:1px solid #333; border-left: 5px solid #ff4d4d; background:#222; margin-bottom:5px; border-radius:8px;">
 <small style="color:#ff4d4d; font-weight:bold;">⚠️ UN-AUTHORIZED</small><br>
 <span style="color:#888; font-size:11px;">${log.date}</span><br>
 <strong style="color:#eee;">${log.msg}</strong></div>`;
 });
 }
 display.innerHTML = html;
 }

 function downloadHistoryCSV() {
 let allLogs = [...JSON.parse(localStorage.getItem("samxi_logs") || "[]"), ...JSON.parse(localStorage.getItem("samxi_unauthorized_logs") || "[]")];
 if (allLogs.length === 0) { showToast("No history to download!", "error"); return; }
 allLogs.sort((a, b) => new Date(b.date) - new Date(a.date));
 let csvContent = "Date and Time,Message\n";
 allLogs.forEach(log => { csvContent += `${log.date},${(log.msg.includes("UNEXPECTED")) ? "!!! ALERT !!! " : "LOG: "}${log.msg.replace(/,/g, " ")}\n`; });
 const link = document.createElement("a"); link.setAttribute("href", URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }))); link.setAttribute("download", `${localStorage.getItem("samxi_id") || "SAMXI_DOOR"}_Activity_Log.csv`); link.click(); showToast("File Downloaded!", "green");
 }

 window.onload = function() {
 let savedID = localStorage.getItem("samxi_id"); if(savedID) document.getElementById('id').value = savedID;
 if(localStorage.getItem("samxi_pin")) document.getElementById('entryPin').value = localStorage.getItem("samxi_pin");
 document.body.addEventListener('click', function() { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });
 };
 </script>
</body>
</html>
