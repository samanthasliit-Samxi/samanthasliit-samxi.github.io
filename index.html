<!DOCTYPE html>
<html>
<head>
    <title>SAMXI SMART DOOR PRO</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        .modal-content button {
            width: 100%; height: 55px; margin: 10px 0; padding: 0; font-size: 1.1rem;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; font-weight: bold;
        }
        body{font-family:sans-serif;text-align:center;background:#141414;color:white;margin:0;}
        .header{background:#1a1a1a;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #2ecc71;}
        .led-group{display:flex; align-items:center; gap:12px;}
        .wifi-box{font-size:0.75rem; font-weight:bold; color:#888; display:flex; align-items:center; gap:4px; background:#222; padding:3px 12px; border-radius:15px; border:1px solid #333; transition: 0.3s;}
        .sig-excellent{color:#00ff7f; border-color: #00ff7f;}
        .sig-good{color:#f1c40f; border-color: #f1c40f;}
        .sig-weak{color:#ff4d4d; border-color: #ff4d4d;}
        .led{height:15px;width:15px;border-radius:50%;background:#444;transition:0.3s;}
        .green{background:#00ff7f;box-shadow:0 0 10px #00ff7f;}
        .red{background:#ff4d4d;box-shadow:0 0 10px #ff4d4d;}
        .gear-icon{width:22px; height:22px; cursor:pointer; fill:#f1c40f; visibility:hidden;}
        .container{padding:15px;max-width:400px;margin:auto;}
        #id {font-size: 2rem; font-weight: bold; text-align: center; color: #2ecc71; border: 2px solid #333;}
        input,select{width:100%;padding:15px;margin:10px 0;background:#2a2a2a;border:1px solid #333;color:white;border-radius:8px;box-sizing:border-box;}
        .status-box{background:#2a2a2a;margin:15px 0;padding:25px;border-radius:12px;font-size:1.6rem;color:#2ecc71;border:1px solid #333;font-weight:bold; transition: 0.3s; position: relative; overflow: hidden;}
        .progress-container{position:absolute; bottom:0; left:0; width:100%; height:6px; background:#1a1a1a; display:none;}
        .progress-bar{height:100%; width:0%; background:#2ecc71; transition: linear;}
        .net-status{font-size:0.9rem; margin-bottom:10px; padding:5px; border-radius:5px;}
        .online-bg{background:#1e3a1e; color:#00ff7f;}
        .offline-bg{background:#3a1e1e; color:#ff4d4d;}
        .alert-active{background:#ff4d4d !important; color:white !important; animation: blink 1s infinite;}
        @keyframes blink { 50% { opacity: 0.5; } }
        .btn{width:100%;margin:10px 0;padding:20px;font-size:1.5rem;border:none;border-radius:12px;font-weight:bold;cursor:pointer;color:white;transition:transform 0.1s; height: 70px; display: flex; align-items: center; justify-content: center;}
        .btn:active{transform:scale(0.96);}
        .up{background:#2ecc71;}
        .stop{background:#e74c3c;}
        .down{background:#3498db;}
        .auto{background:#f1c40f;color:black;display:none;}
        .timer-lock{pointer-events:none; opacity:0.35 !important; filter: contrast(0.8);}
        .hist-btn{background:#444; font-size:1.1rem; height:50px; margin-top:20px; border:1px solid #555;}
        
        /* THE YELLOW RECONNECT BUTTON */
        #modStat { margin-bottom: 20px; text-align: center; background: rgba(255, 77, 77, 0.1); padding: 10px; border-radius: 8px; }
        .reconnect-btn {
            display: inline-flex; align-items: center; justify-content: center;
            background: #f1c40f !important; color: black !important;
            border: none; border-radius: 10px; padding: 10px 20px;
            font-weight: 900; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 4px #b8960c; margin: 10px auto;
        }
        .reconnect-btn:active { transform: translateY(2px); box-shadow: 0 2px #b8960c; }

        #modal, #hModal, #voiceModal, #tgModal {display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:100; overflow-y: auto;}
        .modal-content{background:#1c1c1c; width:85%; max-width:350px; margin:30px auto; padding:25px; border-radius:20px; text-align:left; border:1px solid #333; padding-bottom: 50px;}
        .exit-link {background:none; color:#FFFFFF !important; border:none; margin-top:30px; display:block; width:100%; font-weight:900; font-size:2rem; cursor:pointer; text-shadow:0 0 10px #ffffff, 0 0 20px #ffffff; text-align: center;}
        #logList{list-style:none; padding:0; margin:0; max-height:250px; overflow-y:auto;}
        .log-item{padding:10px; border-bottom:1px solid #333; display:flex; flex-direction:column; font-size:0.85rem;}
        .log-date{color:#888; font-size:0.75rem;}
        .log-msg{color:#2ecc71; font-weight:bold; margin-top:3px;}
        #toast {visibility: hidden; min-width: 280px; color: #fff; text-align: center; border-radius: 12px; padding: 18px; position: fixed; z-index: 1000; left: 50%; bottom: 40px; transform: translateX(-50%); box-shadow: 0 8px 20px rgba(0,0,0,0.6); font-weight: bold; font-size: 1.1rem; transition: 0.3s;}
        #toast.show {visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s;}
        .toast-red { background-color: #e74c3c; border: 2px solid #c0392b; }
        .toast-green { background-color: #2ecc71; border: 2px solid #27ae60; color: #141414 !important; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>
    <div id="printArea" style="display:none;"></div>
    <div class="header">
        <span>SAMXI SMART DOOR</span>
        <div class="led-group">
            <div id="wifiSig" class="wifi-box" style="display:none;"> <span id="rssiVal">--</span></div>
            <div id="led" class="led"></div>
            <svg id="gear" class="gear-icon" onclick="document.getElementById('modal').style.display='block'" viewBox="0 0 24 24">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32.12.22.37.29.59.22l2.39-.96c.5.38(1.03).7-1.62-.94l.36-2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
        </div>
    </div>

    <div class="container">
        <div id="pg1">
            <h2 style="color:#2ecc71;">LOGIN</h2>
            <div id="netStat" class="net-status online-bg" style="min-height: 40px;">Checking Connection...</div>
            <input type="text" id="id" placeholder="PRODUCT ID" value="SAMXI_12345">
            <button id="sessionBtn" onclick="connect()" class="btn up" style="padding:15px; font-size:1.3rem;">NEXT</button>
        </div>

        <div id="pg2" style="display:none;">
            <div class="status-box">CONNECTED</div>
            <input type="password" id="entryPin" placeholder="ENTER 4-DIGIT PIN" maxlength="4" style="text-align:center; font-size:1.8rem; border:2px solid #f1c40f;">
            <button onclick="verifyPin()" class="btn down" style="color:black; background:#f1c40f;">UNLOCK DOOR</button>
        </div>

        <div id="pg3" style="display:none;">
            <div class="status-box" id="stat"> CHECKING SENSOR... <div class="progress-container" id="pCont"><div class="progress-bar" id="pBar"></div></div> </div>
            <div id="lastUpdate" style="font-size: 0.8rem; color: #888; margin-top: -10px; margin-bottom: 10px;">Last update: --:--</div>
            <button id="m1" class="btn up" onclick="cmd('up', 'OPEN GATE')">OPEN DOOR</button>
            <button id="m2" class="btn stop" onclick="cmd('stop', 'STOP GATE')">STOP</button>
            <button id="m3" class="btn down" onclick="cmd('down', 'CLOSE GATE')">CLOSE DOOR</button>
            <button id="abtn" class="btn auto" onclick="startAuto()">AUTO CLOSE</button>
            <button id="hbtn" class="btn hist-btn" onclick="openHistory()">VIEW ACTIVITY HISTORY</button>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2 style="color:#2ecc71; margin-top:0;">SETTINGS</h2>
            <div id="modStat"></div> 
            
            <label>Auto Close:</label>
            <select id="ae" onchange="save()">
                <option value="1">ENABLED</option>
                <option value="0">DISABLED</option>
            </select>
            <label>Timer (sec):</label>
            <input type="number" id="at" onfocus="timerEditing=true" oninput="timerEditing=true">
            <button onclick="save()" style="background:#2ecc71; color:black; font-weight: bold;">SAVE SETTINGS</button>
            <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
            <button onclick="openTgModal()" style="background:#3498db; color:white;"> SYNC TELEGRAM ALERTS</button>
            <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
            <label>Update PIN:</label>
            <input type="password" id="newPin" placeholder="4 Digits" maxlength="4">
            <button onclick="changePin()" style="background:#f1c40f; color: black;">SET NEW PIN</button>
            <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
            <button onclick="openVoiceModal()" style="background:#9b59b6; color:white;"> VOICE COMMAND SETUP</button>
            <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
            <button onclick="factoryReset()" style="background:#e74c3c; color:white;">FACTORY RESET</button>
            <button onclick="document.getElementById('modal').style.display='none'" class="exit-link">EXIT</button>
        </div>
    </div>

    <div id="tgModal">
        <div class="modal-content">
            <h2 style="color:#3498db; margin-top:0;">TELEGRAM SYNC</h2>
            <p style="color:#aaa; font-size:0.8rem;">1. Start <a href="https://t.me/Samxi_Security_bot" target="_blank" style="color:#3498db; text-decoration: underline;">@Samxi_Security_bot</a></p>
            <p style="color:#aaa; font-size:0.8rem;">2. Get your ID from <a href="https://t.me/userinfobot" target="_blank" style="color:#3498db; text-decoration: underline;">@userinfobot</a></p>
            <input type="text" id="tgChatId" placeholder="Paste Chat ID here">
            <button onclick="syncTelegram()" style="background:#3498db; color:white;">SAVE TO DOOR</button>
            <button onclick="document.getElementById('tgModal').style.display='none'; document.getElementById('modal').style.display='block';" class="exit-link" style="font-size:1.5rem;">BACK</button>
        </div>
    </div>
    <div id="voiceModal">
        <div class="modal-content">
            <h2 style="color:#9b59b6; margin-top:0;"> VOICE SETUP</h2>
            <p style="color:#aaa; font-size:0.85rem; margin-top:-10px; margin-bottom:15px;">Link using Sinric Pro keys.</p>
            <input type="text" id="sKey" placeholder="App Key"><input type="text" id="sSecret" placeholder="App Secret"><input type="text" id="sId" placeholder="Device ID">
            <button onclick="saveVoice()" style="background:#9b59b6; color:white;">LINK TO CLOUD</button>
            <button onclick="document.getElementById('voiceModal').style.display='none'; document.getElementById('modal').style.display='block';" class="exit-link" style="font-size: 1.5rem;">BACK</button>
        </div>
    </div>
    <div id="hModal">
        <div class="modal-content">
            <h2 style="color:#2ecc71; margin-top:0;">ACTIVITY HISTORY</h2>
            <ul id="logList"></ul>
            <hr style="border:0; border-top:1px solid #333; margin:20px 0;"><h3 style="color:#ff4d4d; margin:0; font-size:1.1rem;"> UN-AUTHORIZED LOG</h3>
            <div id="securityLogDisplay" style="margin-top:10px; max-height:250px; overflow-y:auto; font-size: 0.85rem; background:#000; padding:5px; border-radius:8px; border:1px solid #333;"></div>
            <button onclick="downloadPDFReport()" style="background:#2ecc71; color:#141414; margin-top: 20px;">📄 SECURITY AUDIT REPORT</button>
            <button onclick="downloadNetworkReport()" style="background:#f1c40f; color:#141414;">📊 POWER & WIFI REPORT</button>          
            <button onclick="downloadHistoryCSV()" style="background:#3498db; color:white;"> DOWNLOAD MASTER HISTORY (CSV)</button>
            <button onclick="clearHistory()" style="background:#444; color:white; margin-top: 20px;">CLEAR ALL LOGS</button>
            <button onclick="document.getElementById('hModal').style.display='none'" class="exit-link">EXIT</button>
        </div>
    </div>
    <div id="toast"></div>

    <script>
        let processedLogIds = JSON.parse(localStorage.getItem("processed_ids") || "[]");
        let wakeLock = null, client, dev, currentWait = 10, countdownTimer;
        let timerEditing = false, isCountingDown = false, isStatusLocked = false, lastSensorStatus = "OFFLINE";
        let gateReminderTimer = null, reminderInterval = 5 * 60 * 1000;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        async function requestWakeLock() { try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (e) {} }
        function showToast(m, t, time = 4000) { let x = document.getElementById("toast"); x.innerText = m; x.className = "show " + (t === 'error' ? 'toast-red' : 'toast-green'); setTimeout(() => { x.className = ""; }, time); }
        function vibrateAlert(t) { if ("vibrate" in navigator) { t === 'opening' ? navigator.vibrate([500, 100, 500]) : navigator.vibrate(200); } }
        function playBeep(f, d) { try { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = f; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d); } catch(e){} }

        function connect() {
            if ("vibrate" in navigator) navigator.vibrate(50);
            dev = document.getElementById('id').value.trim();
            if(!dev) { Swal.fire({ title: 'ID REQUIRED', icon: 'warning', background: '#1a1a1a', color: '#fff' }); return; }
            localStorage.setItem("samxi_id", dev);
            
            client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "cl_" + Math.random().toString(16).slice(2,8));
            
            client.onConnectionLost = (e) => {
                document.getElementById('led').className = "led red";
                let reconnectUI = `<div style="text-align:center;"><span style="color:#ff4d4d; font-weight:bold; display:block; margin-bottom:5px;">OFFLINE</span><button class="reconnect-btn" onclick="connect();">RECONNECT SYSTEM</button></div>`;
                
                // Show reconnect button on First Page status
                document.getElementById('netStat').innerHTML = reconnectUI;
                document.getElementById('netStat').className = "net-status offline-bg";
                
                // Show reconnect on Main page status box
                if(document.getElementById('pg3').style.display === 'block') {
                    document.getElementById('stat').innerHTML = reconnectUI + document.getElementById('pCont').outerHTML;
                }
                
                // Show reconnect in Settings Modal
                document.getElementById('modStat').innerHTML = reconnectUI;
                
                freezePanel(true, true);
            };

            client.onMessageArrived = (m) => {
                let p = m.payloadString.trim(), topic = m.destinationName, s = document.getElementById('stat');
                document.getElementById('led').className = "led green";
                document.getElementById('modStat').innerHTML = ""; 
                document.getElementById('netStat').innerHTML = "System Connected";
                document.getElementById('netStat').className = "net-status online-bg";
                freezePanel(false, true);

                if (topic.includes("/security")) {
                    let securityLogs = JSON.parse(localStorage.getItem("local_security_records") || "[]"), parts = p.split('|');
                    if (parts.length < 4) return;
                    let logId = parseInt(parts[0]), espDate = parts[1], espTime = parts[2], logMsg = parts[3];
                    if (!processedLogIds.includes(logId)) {
                        processedLogIds.push(logId); localStorage.setItem("processed_ids", JSON.stringify(processedLogIds));
                        securityLogs.unshift({ id: logId, date: espDate, time: espTime, msg: logMsg }); localStorage.setItem("local_security_records", JSON.stringify(securityLogs));
                        if (logMsg.includes("Command")) addLog(logMsg); else showToast(`🛡️ LOGGED EVENT #${logId}`, "green");
                        if (document.getElementById('hModal').style.display === 'block') renderSecurityUI();
                    }
                    return;
                }
                if (p === "OPENING" || p === "OPEN") {
                    if (lastSensorStatus !== "OPEN") { showToast("ALERT: Opening!", "error"); vibrateAlert('opening'); addLog("Detected : GateOpened"); }
                    lastSensorStatus = "OPEN"; if(!isStatusLocked) { s.innerHTML = "GATE OPENED" + document.getElementById('pCont').outerHTML; s.style.backgroundColor = "#3a1e1e"; }
                } else if (p === "CLOSED") {
                    if (lastSensorStatus !== "CLOSED") { showToast("SUCCESS: Closed", "green"); vibrateAlert('closed'); addLog("Detected : GateClosed"); }
                    lastSensorStatus = "CLOSED"; if(!isStatusLocked) { s.innerHTML = "GATE CLOSED" + document.getElementById('pCont').outerHTML; s.style.backgroundColor = "#1e3a1e"; }
                } else if (p === "PIN_OK") {
                    localStorage.setItem("samxi_pin", document.getElementById('entryPin').value);
                    document.getElementById('pg1').style.display='none'; document.getElementById('pg2').style.display='none'; document.getElementById('pg3').style.display='block';
                    document.getElementById('gear').style.visibility='visible'; send("GET_STATE");
                } else if (p === "WRONG_PIN") { Swal.fire({ title: 'DENIED', icon: 'error', background: '#1a1a1a', color: '#fff' }); }
                else if (p === "ONLINE" || p.startsWith("DATA|")) {
                    if (p.startsWith("DATA|")) { let d = p.split("|"); updateWiFi(d[1]); if (!timerEditing) { document.getElementById('at').value = d[3]; currentWait = d[3]; document.getElementById('ae').value = d[2]; document.getElementById('abtn').style.display = (d[2] == "1") ? "block" : "none"; } }
                    document.getElementById('pg1').style.display='none'; if(document.getElementById('pg3').style.display !== 'block') document.getElementById('pg2').style.display = 'block';
                }
            };

            client.connect({ useSSL: true, keepAliveInterval: 10, timeout: 5, onSuccess: () => {
                client.subscribe("samxi/" + dev + "/state", { qos: 1 });
                client.subscribe("samxi/" + dev + "/security/#", { qos: 1 });
                requestWakeLock(); send("GET_STATE");
                document.getElementById('netStat').innerText = "System Ready"; setTimeout(() => { document.getElementById('netStat').style.display = 'none'; }, 2000);
            }, onFailure: (e) => { 
                document.getElementById('netStat').innerHTML = `<div style="text-align:center;"><span style="color:#ff4d4d; font-weight:bold;">CONNECTION FAILED</span><br><button class="reconnect-btn" onclick="connect();">RECONNECT SYSTEM</button></div>`;
            } });
        }

        // --- PRESERVED FUNCTIONS ---
        function cmd(type, logMsg) { if ("vibrate" in navigator) navigator.vibrate(100); if(isCountingDown && type !== 'auto') return; isStatusLocked = true; const s = document.getElementById('stat'); s.innerHTML = "WORKING..." + document.getElementById('pCont').outerHTML; showProgress(8); setTimeout(() => { isStatusLocked = false; s.innerHTML = (lastSensorStatus==="OPEN"?"GATE OPENED":"GATE CLOSED") + document.getElementById('pCont').outerHTML; }, 8000); addLog(logMsg); send(type); }
        function startAuto() { if(isCountingDown) return; isCountingDown = true; let duration = parseInt(currentWait), endTime = Date.now() + (duration * 1000), abtn = document.getElementById('abtn'); cmd('auto', 'AUTO CLOSE START'); freezePanel(true, false); countdownTimer = setInterval(() => { let tl = Math.round((endTime - Date.now()) / 1000); if (tl > 0) { abtn.innerText = "Closing in " + tl + "s"; if(tl <= 3) playBeep(1200, 0.2); } else { clearInterval(countdownTimer); abtn.innerText = "AUTO CLOSE"; isCountingDown = false; freezePanel(false, true); send('down'); } }, 1000); }
        function send(c) { if(client && client.isConnected()){ let m = new Paho.MQTT.Message(c); m.destinationName = "samxi/"+dev+"/cmd"; client.send(m); } }
        function save() { let tv = document.getElementById('at').value, av = document.getElementById('ae').value; currentWait = tv; document.getElementById('abtn').style.display = (av == "1") ? "block" : "none"; send("CONFIG|" + tv + "|" + av); showToast("SAVED", "green"); }
        function changePin() { let np = document.getElementById('newPin').value; if(np.length < 4) return; send("SETPIN|" + np); }
        function addLog(msg) { const now = new Date(), ds = now.toLocaleDateString(), ts = now.toLocaleTimeString(); let logs = JSON.parse(localStorage.getItem("samxi_logs") || "[]"); logs.unshift({ date: ds + " " + ts, msg: msg }); localStorage.setItem("samxi_logs", JSON.stringify(logs)); }
        function openHistory() { let logs = JSON.parse(localStorage.getItem("samxi_logs") || "[]"); document.getElementById('logList').innerHTML = logs.map(l => `<li class="log-item"><span class="log-date">${l.date}</span><span class="log-msg">${l.msg}</span></li>`).join(''); renderSecurityUI(); document.getElementById('hModal').style.display = 'block'; }
        function renderSecurityUI() { let logs = JSON.parse(localStorage.getItem("local_security_records") || "[]"); document.getElementById("securityLogDisplay").innerHTML = logs.map(l => `<div style="padding:5px; border-bottom:1px solid #222;"><span style="color:#666; font-size:0.7rem;">${l.date} ${l.time}</span><br><b>${l.msg}</b></div>`).join(''); }
        function downloadPDFReport() { const devId = localStorage.getItem("samxi_id"); const secLogs = JSON.parse(localStorage.getItem("local_security_records") || "[]"); let tableRows = secLogs.map((l, i) => `<tr><td>${i + 1}</td><td>${l.date}</td><td>${l.time}</td><td>${l.msg}</td></tr>`).join(''); const element = document.createElement('div'); element.innerHTML = `<h1>SAMXI AUDIT: ${devId}</h1><table><tr><th>#</th><th>Date</th><th>Time</th><th>Event</th></tr>${tableRows}</table>`; html2pdf().from(element).save(`SAMXI_Audit_${devId}.pdf`); }
        function downloadHistoryCSV() { let regLogs = JSON.parse(localStorage.getItem("samxi_logs") || "[]"); let csv = "DATE,DESCRIPTION\n" + regLogs.map(l => `${l.date},${l.msg}`).join('\n'); let blob = new Blob([csv], {type: 'text/csv'}); let url = URL.createObjectURL(blob); let a = document.createElement('a'); a.href = url; a.download = `SAMXI_Logs.csv`; a.click(); }
        function updateWiFi(rssi) { let box = document.getElementById('wifiSig'); box.style.display = 'flex'; document.getElementById('rssiVal').innerText = rssi + "dBm"; box.className = "wifi-box " + (rssi >= -60 ? "sig-excellent" : "sig-weak"); }
        function showProgress(d) { let bar = document.getElementById('pBar'); document.getElementById('pCont').style.display = 'block'; bar.style.width = '0%'; setTimeout(() => { bar.style.transition = `width ${d}s linear`; bar.style.width = '100%'; }, 50); }
        function hideProgress() { document.getElementById('pCont').style.display = 'none'; }
        function freezePanel(s, f = false) { document.querySelectorAll('#pg3 .btn, #modal input, #modal select, #modal button').forEach(el => { if (f || el.id !== 'abtn') s ? el.classList.add('timer-lock') : el.classList.remove('timer-lock'); }); }
        function openTgModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('tgModal').style.display = 'block'; }
        function syncTelegram() { send("SETCHAT|" + document.getElementById('tgChatId').value); showToast("SYNCED", "green"); }
        function factoryReset() { Swal.fire({ title: 'RESET?', icon: 'warning', showCancelButton: true }).then(r => { if(r.isConfirmed) send('RESET_FACTORY'); }); }
        function openVoiceModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('voiceModal').style.display = 'block'; }
        function saveVoice() { send("SINRIC|" + document.getElementById('sKey').value + "|" + document.getElementById('sSecret').value + "|" + document.getElementById('sId').value); }
        function verifyPin() { if(audioCtx.state === 'suspended') audioCtx.resume(); requestWakeLock(); send("VERIFY|" + document.getElementById('entryPin').value); }

        window.onload = function() {
            let sID = localStorage.getItem("samxi_id"); if(sID) document.getElementById('id').value = sID;
            let sPIN = localStorage.getItem("samxi_pin"); if(sPIN) document.getElementById('entryPin').value = sPIN;
        };
    </script>
</body>
</html>
