    <style>
        /* Base Page Styling (SAMXI ELITE BLACK INTERFACE) */
        body {
            font-family: sans-serif;
            text-align: center;
            background: #1c1c1c; /* Deep, seamless black */
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;

            overflow: hidden;

        /* Top Title Bar */
        .title-bar {
            background: #111111;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2ecc71;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .samxi-text {
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 1.3rem;
        }

        .pro-text-green {
            color: #2ecc71; /* Emerald Green */
        }

        .led-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #444; /* Default OFFLINE color */
            transition: 0.3s;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .green {
            background: #00ff7f; /* ONLINE color */
            box-shadow: 0 0 15px #00ff7f;
        }

        .red {
            background: #ff4d4d; /* ERROR color */
            box-shadow: 0 0 15px #ff4d4d;
        }

        /* Gear Icon */
        .gear-icon {
            width: 25px;
            height: 25px;
            cursor: pointer;
            fill: #f1c40f; /* Amber/Yellow */
            visibility: hidden; /* Hidden until ID verification */
        }

        /* Main Screen Container */
        .container {
            padding: 20px 25px;
            max-width: 420px;
            margin: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            flex-grow: 1;
        }

        /* ADVANCED LOGO EMBEDDING */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .seamless-logo {
            width: 100%;
            max-width: 320px;
            filter: drop-shadow(0 0 25px rgba(0,255,127,0.4)); /* Neon glow effect */

        /* Advanced Security Text (Glow and Color from interface) */

            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: 4px;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(0,255,127,0.5), 0 0 10px rgba(0,255,127,0.2);
        }

        .guard-status-text {
            color: #f1c40f; /* Golden/Amber motto from screenshot */
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        /* Status Boxes (Checks Connection) */
        .status-box {
            background: #2a2a2a;
            color: #f1c40f; /* Amber color from screenshot */
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px 12px;
            font-size: 1rem;
            font-weight: 700;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 25px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        /* Security Shield with specific color/pulse from image */
        .shield-box {
            border: 2px solid #00ff7f; /* Vibrant green from image */
            background: rgba(0, 255, 127, 0.05); /* Soft internal glow */
            padding: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 127, 0.3);
            font-size: 0.95rem;
            animation: shield-pulse 2s infinite ease-in-out;
        }

        /* Label and Input for ID (Samxi Elite Green) */
        .id-label {
            display: block;
            text-align: left;
            font-size: 0.75rem;
            color: #2ecc71; /* Label from screenshot */
            margin-bottom: 10px;
            font-weight: bold;
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input[type="text"] {
            width: 100%;
            padding: 22px;
            font-size: 1.8rem;
            font-weight: 900;
            text-align: center;
            color: #00ff7f; /* Elite green from screenshot */
            background: #050505; /* Blackest input field */

            border-radius: 15px;
            box-sizing: border-box;

        input[type="text"]:focus {

            padding: 22px;
            font-size: 1.6rem;
            border: none;
            border-radius: 20px;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background: #3498db; /* Solid Blue Button from your working app */
            color: white; /* WHITE font color */
        }

        .engage-btn:active {
            transform: scale(0.96);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

            color: #555;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;

        .progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: #1a1a1a; display: none; }
        .progress-bar { height: 100%; width: 0%; background: #2ecc71; transition: linear; }
        .alert-active { background: #ff4d4d !important; color: white !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        #modal, #hModal, #voiceModal, #tgModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; overflow-y: auto; }
        .modal-content { background: #1c1c1c; width: 85%; max-width: 350px; margin: 30px auto; padding: 25px; border-radius: 20px; text-align: left; border: 1px solid #333; padding-bottom: 50px; }

        #toast { visibility: hidden; min-width: 280px; color: #fff; text-align: center; border-radius: 12px; padding: 18px; position: fixed; z-index: 1000; left: 50%; bottom: 40px; transform: translateX(-50%); box-shadow: 0 8px 20px rgba(0,0,0,0.6); font-weight: bold; font-size: 1.1rem; transition: 0.3s; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        .toast-red { background-color: #e74c3c; border: 2px solid #c0392b; }

        @keyframes shield-pulse { 0% { box-shadow: 0 0 5px rgba(0, 255, 127, 0.2); transform: scale(1); } 50% { box-shadow: 0 0 25px rgba(0, 255, 127, 0.5); transform: scale(1.01); background: rgba(0, 255, 127, 0.1); } 100% { box-shadow: 0 0 5px rgba(0, 255, 127, 0.2); transform: scale(1); } }

    <script>

        let dev;
        function connect() { 
            dev = document.getElementById('id').value.trim(); 
            if(!dev) { 
                Swal.fire({ title: 'ID REQUIRED', text: 'Enter device ID.', icon: 'warning', background: '#1a1a1a', color: '#fff' });

            }
